# Cloudflare Worker config for the Telegram → Apps Script webhook proxy.
# Deploy with `wrangler deploy`. See README.md for the full runbook.

name = "sales-nudge-proxy"
main = "worker.js"
compatibility_date = "2026-06-01"

# Secrets are NOT stored here — set them with wrangler so they never hit git:
#   wrangler secret put EXEC_URL        # Apps Script /exec URL incl. ?secret=<TELEGRAM_SECRET>
#   wrangler secret put WEBHOOK_SECRET  # same value you pass to Telegram setWebhook secret_token
