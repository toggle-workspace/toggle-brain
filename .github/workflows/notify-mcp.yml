name: Notify toggle-mcp on push

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger toggle-mcp sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MCP_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'toggle-workspace',
              repo: 'toggle-mcp',
              event_type: 'toggle-brain-updated',
              client_payload: {
                sha: context.sha,
                ref: context.ref,
                actor: context.actor
              }
            });
            console.log(`Dispatched toggle-brain-updated event with sha: ${context.sha}`);
