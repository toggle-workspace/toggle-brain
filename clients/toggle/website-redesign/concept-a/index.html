<title>Toggle · Concept A</title>
<meta name="description" content="Toggle Solutions website redesign, Concept A: Clean Room.">
<script>
  /* Theme before first paint: ?theme= wins, then the saved choice, then the OS. */
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), t = null;
    try { t = localStorage.getItem("toggle-theme"); } catch (e) {}
    if (q === "light" || q === "dark") t = q;
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
