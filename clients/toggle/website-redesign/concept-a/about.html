<title>Toggle About · Concept A</title>
<meta name="description" content="Toggle Solutions About page redesign, Concept A: Clean Room.">
<script>
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), t = null;
    try { t = localStorage.getItem("toggle-theme"); } catch (e) {}
    if (q === "light" || q === "dark") t = q;
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
