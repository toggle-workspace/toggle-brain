.qs{display:flex;flex-direction:column;gap:8px}
.qs span{display:flex;align-items:center;gap:10px;font-size:15px;padding:9px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.qs span::before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto;box-shadow:4px 4px 0 -2.5px var(--ink-3)}
.msg{font-family:var(--serif);font-size:27px !important;line-height:1.15 !important;letter-spacing:-.01em}

/* critical data */
.cj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:30px}
.cjq{background:var(--ink);color:#EAF1FA;border-radius:22px;padding:34px 36px;display:flex;flex-direction:column;position:relative;overflow:hidden;background-image:var(--glow-dark)}
.cjq .mono{color:var(--aqua)}
.cjq h3{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1.02;letter-spacing:-.02em;margin:14px 0 0}
.cjq h3 em{font-style:italic;color:var(--aqua)}
.cjq p{margin:18px 0 0;font-size:16.5px;line-height:1.5;color:rgba(234,241,250,.75)}
.cjgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:24px}
.gem{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);border-radius:12px;padding:12px 14px;text-align:left;color:#EAF1FA;display:flex;flex-direction:column;gap:6px;transition:.25s}
.gem:hover{border-color:rgba(255,255,255,.4)}
.gem[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.gem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gem b{font-size:14.5px;font-weight:600;line-height:1.25}
.cjout{display:flex;flex-direction:column;gap:10px}
.cjrow{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 20px;border-radius:14px;background:var(--paper-lift);border:1px solid var(--line);animation:pop .4s var(--ease) both}
.cjrow:nth-child(2){animation-delay:.05s}.cjrow:nth-child(3){animation-delay:.1s}.cjrow:nth-child(4){animation-delay:.15s}
.cjrow .mono{padding-top:4px}
.cjrow p{margin:0;font-size:16px;line-height:1.45}
.cjrow.hl{background:var(--ink);border-color:var(--ink);color:#fff}
.cjrow.hl .mono{color:var(--aqua)}
.cjrow.hl p{font-family:var(--serif);font-size:26px;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--accent-wash);color:var(--accent-deep)}
.chip.t{background:var(--threat-wash);color:#A3302B}

/* the map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:26px}
.netcard{background:var(--paper-lift);border:1px solid var(--line);border-radius:20px;padding:20px 22px 14px}
.netsvg{width:100%;height:auto;display:block}
.netsvg text{font-family:var(--sans)}
.netsvg .lane{fill:var(--paper)}
.netsvg .lane2{fill:var(--paper-deep)}
.netsvg .lt{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--ink-3)}
.netsvg .wire{fill:none;stroke:var(--line);stroke-width:3}
.netsvg .flow{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:7 9;stroke-linecap:round;animation:lpflow .9s linear infinite;opacity:0;transition:opacity .4s}
.netsvg .flow.on{opacity:1}
.netsvg .flow.x{stroke:var(--pop)}
.offscreen .netsvg .flow{animation-play-state:paused}
.hop{cursor:pointer}
.hop>rect{fill:var(--paper-lift);stroke:var(--line);stroke-width:1.5;transition:fill .25s,stroke .25s}
.hop:hover>rect{stroke:var(--ink-3)}
.hop.sel>rect{fill:var(--ink);stroke:var(--ink)}
.hop .ic{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hop.sel .ic{stroke:#fff}
.hop .hn{font-size:13px;font-weight:600;fill:var(--ink)}
.hop.sel .hn{fill:#fff}
.hop .hp{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;fill:var(--accent)}
.hop.sel .hp{fill:var(--aqua)}
.hop:focus-visible>rect{stroke:var(--accent);stroke-width:3}
.netlegend{display:flex;gap:22px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.netlegend i{display:inline-block;width:22px;height:0;border-top:3px dashed var(--accent);vertical-align:middle;margin-right:7px}
.netlegend i.x{border-top-color:var(--pop)}
.hopcard{display:flex;flex-direction:column;gap:12px}
.hopcard .card{padding:22px 24px}
.hopcard h3{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.02em;margin:8px 0 0}
.hopcard .stat{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hopcard .stat b{font-family:var(--serif);font-weight:400;font-size:52px;line-height:.9;color:var(--threat);letter-spacing:-.03em}
.hopcard .stat span{font-size:14px;line-height:1.4;color:var(--ink-2)}
.hopcard .stat small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.hopcard p{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink-2)}

/* sector explorer: five columns, one opens */
.sx{display:flex;gap:10px;height:100%}
.sxc{flex:1 1 0;min-width:0;border-radius:20px;border:1px solid var(--line);background:var(--paper-lift);overflow:hidden;display:flex;flex-direction:column;transition:flex-grow .7s var(--ease),background .4s,border-color .4s;cursor:pointer;text-align:left;padding:0;color:inherit}
.sxc[aria-expanded="true"]{flex-grow:5.2;cursor:default;background:var(--paper-lift);border-color:var(--ink)}
.sxh{padding:20px 20px 16px;display:flex;flex-direction:column;gap:8px}
.sxh .sn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sxh h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.02;letter-spacing:-.02em;margin:0}
.sxh .sj{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.sxc[aria-expanded="true"] .sxh{flex-direction:row;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
.sxc[aria-expanded="true"] .sxh h3{font-size:38px}
.sxc[aria-expanded="true"] .sxh .sj{display:none}
.sxc .open{margin-top:auto;padding:16px 20px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sxc[aria-expanded="true"] .open{display:none}
.sxb{display:none;flex:1;min-height:0;padding:16px 22px 18px;grid-template-columns:1.05fr 1fr 1fr;gap:18px}
.sxc[aria-expanded="true"] .sxb{display:grid;animation:pop .5s var(--ease) both .15s}
.sxb .mono{display:block;margin-bottom:8px}
.sxb .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.jewel{font-family:var(--serif);font-size:25px;line-height:1.12;letter-spacing:-.01em}
.vuln{display:flex;flex-direction:column;gap:8px}
.vuln div{padding:10px 12px;border-radius:10px;background:var(--threat-wash);font-size:13.5px;line-height:1.35}
.vuln b{display:block;font-size:14px;color:#A3302B}
.case{padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.case b{color:var(--ink)}
.minipath{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.minipath span{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:5px 7px;border-radius:7px;background:var(--line-soft);color:var(--ink-3);white-space:nowrap}
.minipath span.on{background:var(--threat);color:#fff}
.minipath i{display:none}
.flowtag{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.flowtag b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--pop-wash);color:var(--pop-deep)}

"use strict";
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const fmt = n=>Math.round(n).toLocaleString("en-US");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BADGE = {v:'<span class="badge v"><i></i>Verified</span>',ill:'<span class="badge ill"><i></i>Illustrative model</span>',mock:'<span class="badge mock"><i></i>Mockup</span>',draft:'<span class="badge ill"><i></i>Draft for Sean</span>'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const seg=(el,fn)=>el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!el.contains(b))return;$$("button",el).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b)});

/* Slides are stacked in one stage, so a real IntersectionObserver would see
   every slide as on screen. This stand-in reports an element as visible
   only while its slide is the current one. */
const IOS=[];let PRINTING=false;
window.IntersectionObserver=class{
  constructor(cb){this.cb=cb;this.els=new Map();IOS.push(this)}
  observe(el){this.els.set(el,null);setTimeout(()=>this.ping(),0)}
  unobserve(el){this.els.delete(el)}
  disconnect(){this.els.clear()}
  ping(){const es=[];this.els.forEach((last,el)=>{const s=el.closest(".slide"),on=PRINTING||!!(s&&s.classList.contains("on"));if(on!==last){this.els.set(el,on);es.push({target:el,isIntersecting:on})}});if(es.length)this.cb(es,this)}
};
const pingIO=()=>IOS.forEach(o=>o.ping());
/* run fn each time the element's slide opens */
const onOpen=(el,fn,off)=>new IntersectionObserver(es=>{es[0].isIntersecting?fn():off&&off()}).observe(el);

function countUp(el,to,suf,pre="",dec=0){
  const f=v=>pre+(dec?v.toFixed(dec):fmt(v))+suf;
  if(REDUCED||PRINTING){el.textContent=f(to);return}
  const t0=performance.now(),d=1400;
  const tick=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}

`<section class="slide dark" id="ex-h2h" data-sec="The system" data-title="Lead with the data"><div class="fs"><div class="lft"><div class="kick">The system · The hook ${BADGE.mock}</div><h2 class="sttl" style="font-size:60px">Lead with <em>the data they fear losing</em>.</h2>

"@ex:qualify",

/* close */
`<section class="slide dark" data-sec="Close" data-title="Next step" style="justify-content:center;padding-bottom:110px"><div class="kick">Next step</div>

  <div class="contact" style="margin-top:22px"><div><span class="mono">Toggle Solutions</span><p>hello@toggle.solutions</p></div><div><span class="mono">Viknesh</span><p>+60 12 568 8681</p></div><div><span class="mono">On the web</span><p>toggle.solutions</p></div></div></section>`,

/* sources */
`<section class="slide white" data-sec="Close" data-title="Sources"><div class="kick">Sources</div><h2 class="sttl" style="font-size:52px">Where <em>every number</em> comes from.</h2>
  <ol class="srclist">${SOURCES.map(s=>`<li>${s}</li>`).join("")}</ol></section>`
];
/* alarm numbers and the first-choice dots */
INITS.push(function initAlarm(){onOpen($("#s-alarm .alarm"),()=>$$("#s-alarm [data-count]").forEach(el=>countUp(el,+el.dataset.count,el.dataset.suf,el.dataset.pre,+el.dataset.dec)))});

/* =========================================================================
   DECK ENGINE, lifted from the education deck (Zaid, November 2026) and
   trimmed: same stage, rail, pill nav, observer stand-in, fit and print.
   The call planner is left out; this deck is presented in one order.
   ========================================================================= */
const stage=$("#stage");
const WM='<svg viewBox="0 0 1432 392" aria-hidden="true"><use href="#wm"/></svg>';
stage.innerHTML=SLIDES.map(s=>s.startsWith("@ex:")?xslide(s.slice(4)):s).join("");
const SL=$$(".slide",stage);
SL.forEach((s,i)=>s.insertAdjacentHTML("beforeend",`<div class="sf">${WM}<span>${DECK_NAME}</span><span class="pn">${String(i+1).padStart(2,"0")} / ${SL.length}</span></div>`));
$("#agenda").innerHTML=SYSTEM.map(id=>{const i=SL.findIndex(s=>s.id==="ex-"+id);return `<a href="#${i+1}"><span class="an">${String(i+1).padStart(2,"0")}</span><span class="at">${SL[i].dataset.title}</span></a>`}).join("");

INITS.forEach(f=>{try{f()}catch(err){console.error(f.name+": "+err.message)}});

/* bars grow when their slide opens */
function grow(s,on){
  $$("[data-w]",s).forEach(i=>{i.style.width=on?i.dataset.w+"%":"0"});
  $$(".dots5",s).forEach(d=>d.classList.toggle("on",on));
}

/* fit each exhibit body into the space under its header */
function fitOne(s){const xb=$(".xb",s),f=$(".fit",s);if(!xb||!f)return;let z=+s.dataset.z||1;
  for(let k=0;k<4;k++){f.style.setProperty("--z",z);const h=f.scrollHeight,H=xb.clientHeight,nz=Math.min(1.1,Math.max(.6,H/h*.98));if(Math.abs(nz-z)<.01)break;z=nz}
  f.style.setProperty("--z",z);s.dataset.z=z.toFixed(2)}
function fitAll(){$$(".ex").forEach(fitOne)}
const fitRO=new ResizeObserver(es=>es.forEach(e=>{const s=e.target.closest(".slide");clearTimeout(s._ft);s._ft=setTimeout(()=>{const H=$(".xb",s).clientHeight,h=e.target.scrollHeight*(+s.dataset.z||1);if(h>H+2||h<H*.9)fitOne(s)},120)}));
$$(".ex .fit").forEach(f=>fitRO.observe(f));

let cur=-1;
function go(n){
  n=Math.max(0,Math.min(SL.length-1,n));if(n===cur)return;
  if(cur>=0){const o=SL[cur];o.classList.remove("on");o.classList.add("offscreen");o.inert=true;grow(o,false)}
  cur=n;const s=SL[n];s.classList.add("on");s.classList.remove("offscreen");s.inert=false;
  requestAnimationFrame(()=>grow(s,true));
  $$("#railList button").forEach(b=>{const on=+b.dataset.n===n;b.setAttribute("aria-current",on);if(on)b.scrollIntoView({block:"nearest"})});
  $("#pg").textContent=`${String(n+1).padStart(2,"0")} / ${SL.length}`;$("#tt").textContent=s.dataset.title||"";
  $("#prog").style.width=(n+1)/SL.length*100+"%";
  if(location.hash!=="#"+(n+1))history.replaceState(null,"","#"+(n+1));
  pingIO();
  const wv=$(".cover .wavewrap svg");if(wv&&wv.pauseAnimations){(n===0&&!REDUCED)?wv.unpauseAnimations():wv.pauseAnimations()}
}
const step=d=>go(cur+d);
SL.forEach(s=>{s.inert=true;s.classList.add("offscreen")});
{const sec=SL.map(s=>s.dataset.sec);
 $("#railList").innerHTML=SL.map((s,i)=>`${sec[i]&&sec[i]!==sec[i-1]?`<li class="sec">${sec[i]}</li>`:""}<li><button type="button" data-n="${i}" aria-label="Slide ${i+1}: ${s.dataset.title}"><span class="rn">${String(i+1).padStart(2,"0")}</span><span class="rt">${s.dataset.title}</span></button></li>`).join("");
 $("#railList").addEventListener("click",e=>{const b=e.target.closest("button");if(b){go(+b.dataset.n);b.blur()}});}
const scaleStage=()=>{const rail=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rail"))||0;document.documentElement.style.setProperty("--s",Math.min((innerWidth-rail)/1600,innerHeight/900))};
addEventListener("resize",scaleStage);scaleStage();
const fromHash=()=>{const n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n-1};
addEventListener("hashchange",()=>go(fromHash()));
$("#prev").addEventListener("click",()=>step(-1));$("#next").addEventListener("click",()=>step(1));
document.addEventListener("keydown",e=>{
  const t=e.target;if(t.matches&&t.matches("input,textarea,select"))return;
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&t===document.body)){e.preventDefault();step(1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();step(-1)}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(SL.length-1);
  else if(e.key==="f"&&document.fullscreenEnabled){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}});
let idleT;const wake=()=>{$("#nav").classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>$("#nav").classList.add("idle"),2600)};
addEventListener("mousemove",wake);addEventListener("keydown",wake);wake();

/* print: every slide shows its finished state */
addEventListener("beforeprint",()=>{PRINTING=true;pingIO();SL.forEach(s=>grow(s,true));
  $$("[data-count]").forEach(e=>e.textContent=(e.dataset.pre||"")+fmt(+e.dataset.count)+(e.dataset.suf||""));fitAll()});
addEventListener("afterprint",()=>{PRINTING=false;SL.forEach((s,i)=>{if(i!==cur)grow(s,false)})});

go(fromHash());
(document.fonts?document.fonts.ready:Promise.resolve()).then(fitAll);

</script>
